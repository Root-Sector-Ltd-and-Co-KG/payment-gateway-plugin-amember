name: Validate aMember Release Controls

on:
  pull_request:

permissions:
  contents: read

env:
  SHARED_PUBLISHER_ROOT: ${{ github.workspace }}/shared-plugin-publisher

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout pinned public publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Root-Sector-Ltd-and-Co-KG/payment-gateway-plugin-woocommerce
          ref: e19da7c7086df7edf538f0a9dc0225de5e0cf8c9
          path: shared-plugin-publisher
          persist-credentials: false

      - name: Validate receiver and release controls
        run: |
          php tests/customer-risk-hold.test.php
          php tests/plugin-load.test.php
          php tests/ipn-v2.test.php
          php tests/release-workflow.test.php
          node --test tests/release-policy.test.mjs tests/release-workflow.test.mjs tests/publish-release.test.mjs
